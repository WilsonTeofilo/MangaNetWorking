# Prometheus — MangaNetWorking
#
# Coleta as métricas do backend e avalia as regras de alerta versionadas no repositório.
# O token de coleta vive em arquivo (credentials_file) e nunca é versionado.
#
# Em produção o backend exige `METRICS_SCRAPE_TOKEN` (Authorization: Bearer); o guard
# `ProductionMetricsScrapeTokenGuard` recusa o boot em `prod` sem token.
global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    env: local

rule_files:
  - /etc/prometheus/manganetworking-alerts.yml

scrape_configs:
  - job_name: manganetworking-backend
    metrics_path: /actuator/prometheus
    scheme: http
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics-scrape-token
    static_configs:
      - targets:
          - backend:8085
