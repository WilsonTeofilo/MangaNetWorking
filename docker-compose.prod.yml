name: manganetworking-prod

services:
  # ----------------------------------------------------
  # BANCO DE DADOS RELACIONAL: PostgreSQL 16
  # ----------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: manganetworking-postgres-prod
    restart: always
    environment:
      POSTGRES_DB: manganetworking
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no ambiente}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - internal_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d manganetworking"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------
  # BANCO DE DADOS DOCUMENTAL: MongoDB 7
  # ----------------------------------------------------
  mongodb:
    image: mongo:7.0
    container_name: manganetworking-mongo-prod
    restart: always
    environment:
      MONGO_INITDB_DATABASE: manganetworking_events
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?Defina MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Defina MONGO_ROOT_PASSWORD}
    volumes:
      - mongo_prod_data:/data/db
    networks:
      - internal_network
    healthcheck:
      test: ["CMD-SHELL", "mongosh --username \"$$MONGO_INITDB_ROOT_USERNAME\" --password \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval \"db.adminCommand('ping')\""]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------
  # BANCO DE DADOS DISTRIBUÍDO EM MEMÓRIA: Redis 7
  # ----------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: manganetworking-redis-prod
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Defina REDIS_PASSWORD para o Redis de produção}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Defina REDIS_PASSWORD para o Redis de produção}
    volumes:
      - redis_prod_data:/data
    networks:
      - internal_network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ----------------------------------------------------
  # BACKEND API: Spring Boot 3.4 (Java 21)
  # ----------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: manganetworking-backend-prod
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      PLATFORM_MAIL_ENABLED: "true"
      MAIL_HOST: ${MAIL_HOST:?Defina MAIL_HOST para o servidor SMTP autenticado}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:?Defina MAIL_USERNAME para o servidor SMTP}
      MAIL_PASSWORD: ${MAIL_PASSWORD:?Defina MAIL_PASSWORD para o servidor SMTP}
      MAIL_SMTP_AUTH: "true"
      MAIL_SMTP_STARTTLS: "true"
      MAIL_FROM: ${MAIL_FROM:?Defina MAIL_FROM em um domínio autenticado}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-MangaNetWorking}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/manganetworking
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no ambiente}
      SPRING_DATA_MONGODB_URI: ${SPRING_DATA_MONGODB_URI:?Defina SPRING_DATA_MONGODB_URI com autenticação Mongo e authSource=admin}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Defina REDIS_PASSWORD para o Redis de produção}
      PLATFORM_SESSION_STORE: redis
      PLATFORM_RATELIMIT_STORE: redis
      PLATFORM_OTP_STORE: redis
      AES_SECRET_KEY: ${AES_SECRET_KEY:?Defina AES_SECRET_KEY com chave de 256 bits}
      OTP_HMAC_SECRET: ${OTP_HMAC_SECRET:?Defina OTP_HMAC_SECRET com ao menos 32 bytes}
      PUBLIC_FRONTEND_URL: ${PUBLIC_FRONTEND_URL:?Defina a origem pública HTTPS do frontend}
      PASSWORD_RESET_TOKEN_TTL: ${PASSWORD_RESET_TOKEN_TTL:-PT30M}
      COOKIE_SECURE: "true"
      STORAGE_UPLOAD_DIR: /data/uploads
    volumes:
      - storage_prod_uploads:/data/uploads
    networks:
      - internal_network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8085/actuator/health/readiness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ----------------------------------------------------
  # FRONTEND WEB: React 19 + Nginx Alpine
  # ----------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: manganetworking-frontend-prod
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${PORT:-80}:80"
    networks:
      - internal_network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1/ || exit 1"]
      interval: 20s
      timeout: 3s
      retries: 3

# ----------------------------------------------------
# VOLUMES E REDE
# ----------------------------------------------------
volumes:
  postgres_prod_data:
    name: manganetworking_postgres_prod_data
  mongo_prod_data:
    name: manganetworking_mongo_prod_data
  redis_prod_data:
    name: manganetworking_redis_prod_data
  storage_prod_uploads:
    name: manganetworking_storage_prod_uploads

networks:
  internal_network:
    name: manganetworking_prod_network
    driver: bridge

