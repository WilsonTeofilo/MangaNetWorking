server:
  port: 8085

spring:
  profiles:
    default: local
  application:
    name: manganetworking-backend
  jackson:
    deserialization:
      fail-on-unknown-properties: true

  # Carrega o .env da raiz do repositório quando o backend roda fora do Docker
  # (IDE ou `mvn spring-boot:run` a partir de backend/). O prefixo `optional:`
  # mantém o boot funcionando em produção, onde as variáveis vêm do container e
  # não existe arquivo .env. O hint [.properties] ensina o Spring a ler o arquivo
  # sem extensão no formato chave=valor.
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]

  # Banco de Dados Relacional (PostgreSQL)
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:25432/manganetworking}
    # Em produção, defina SPRING_DATASOURCE_USERNAME e SPRING_DATASOURCE_PASSWORD via variáveis de ambiente.
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  # Flyway Migrations (Schema versionado em db/migration/)
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate # Flyway gerencia o schema autoritativamente
    show-sql: false
    # Sem OSIV: a sessão Hibernate encerra ao fim do serviço transacional. Assim, serializar
    # uma associação LAZY fora da transação falha alto (em vez de disparar queries silenciosas
    # durante a renderização) e a conexão não fica presa durante a camada web.
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # Banco de Dados Não-Relacional (MongoDB para Feed, Algoritmo e Eventos de Engajamento)
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/manganetworking_events}
      # Materializa @Indexed/@CompoundIndex no boot (sem isso os índices ficam só no código).
      auto-index-creation: true
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

  # Envio de E-mails (Mailpit em dev / SMTP real em produção)
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    # Segredo compartilhado do webhook de bounce/complaint do provedor de e-mail.
    # Vazio = webhook desabilitado (nada é aceito).
    webhook-secret: ${EMAIL_WEBHOOK_SECRET:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  # Limites de upload aplicados antes de ler arquivos inteiros em memória (anti-DoS)
  servlet:
    multipart:
      max-file-size: ${STORAGE_MAX_FILE_SIZE_MB:15}MB # Mesma variável de platform.storage.max-file-size-mb
      max-request-size: 200MB # Cobre o upload em lote de páginas de um capítulo

# Parâmetros de Negócio da Plataforma MangaNetWorking
platform:
  password-reset:
    frontend-url: ${PUBLIC_FRONTEND_URL:http://localhost:5180}
    token-ttl: ${PASSWORD_RESET_TOKEN_TTL:PT30M}
  privacy:
    policy-version: ${PRIVACY_POLICY_VERSION:2026-10-v1}
    # Texto oficial da Política de Privacidade: caminho absoluto do arquivo aprovado.
    # Vazio = ainda não publicado (a API responde 404 POLICY_NOT_PUBLISHED).
    policy-document: ${PRIVACY_POLICY_DOCUMENT:}
    # Alternativa versionada no repositório após aprovação: legal/privacy-policy/<versão>.md
    policy-classpath-dir: ${PRIVACY_POLICY_CLASSPATH_DIR:legal/privacy-policy}
  fee-percentage: 0.17 # 17% retido pela plataforma sobre doações e membros
  creator-share-percentage: 0.83 # 83% repasse líquido ao criador
  vip-price: 23.00 # R$ 23 / 30 dias para remoção total de anúncios
  membership:
    min-price: 7.99
    max-price: 45.99
  ads:
    pages-per-ad: 30 # Anúncio a cada 30 páginas lidas
    cpm-brl: 0.05 # R$ 0,05 de CPM base estimado
    creator-share-percentage: 0.58 # 58% para o criador monetizado
    platform-share-percentage: 0.42 # 42% para a plataforma
  security:
    two-factor-mandatory: true # 2FA obrigatório até mesmo para login com Google
    # Chave AES-256 para criptografia de dados sensíveis (CPF/PIX de criadores).
    # Em produção, defina AES_SECRET_KEY (variável de ambiente) com pelo menos 32 caracteres.
    # Se não definida, será usada uma chave de desenvolvimento local.
    aes-secret-key: ${AES_SECRET_KEY:}
    otp-hmac-secret: ${OTP_HMAC_SECRET:manganetworking-local-otp-hmac-secret-change-before-production}
    rate-limit-per-minute: 120 # Throttling global por IP
    auth-rate-limit-per-minute: 15 # Throttling estrito para login/cadastro/2fa
    # Intervalos lidos pelo @Scheduled (fonte única — não repetir o valor no código).
    session-cleanup-interval-ms: 3600000 # Limpeza ativa de sessões expiradas a cada 1 hora (prevenção de memory leaks OWASP)
    rate-limit-cleanup-interval-ms: 300000 # Expurgo ativo de buckets de rate limit a cada 5 minutos
    cookie-secure: ${COOKIE_SECURE:false} # true em produção (HTTPS); atributo Secure do cookie de sessão
    trust-forwarded-headers: ${TRUST_FORWARDED_HEADERS:false} # Só habilitar atrás de um proxy reverso confiável que acrescente/limpe X-Forwarded-For
  session:
    store: ${PLATFORM_SESSION_STORE:inmemory} # 'inmemory' ou 'redis'
  ratelimit:
    store: ${PLATFORM_RATELIMIT_STORE:inmemory} # 'inmemory' ou 'redis'
  otp:
    store: ${PLATFORM_OTP_STORE:inmemory} # 'inmemory' ou 'redis'; desafios são compartilhados entre réplicas
    key-prefix: ${PLATFORM_OTP_KEY_PREFIX:mn:otp:challenge:}
  mail:
    enabled: ${PLATFORM_MAIL_ENABLED:false} # true para enviar via SMTP (Gmail, Resend, Brevo, Mailpit)
    from-address: ${MAIL_FROM:nao-responda@manganetworking.com}
    from-name: ${MAIL_FROM_NAME:MangaNetWorking}
  mercadopago:
    access-token: ${MERCADOPAGO_ACCESS_TOKEN:}
    webhook-secret: ${MERCADOPAGO_WEBHOOK_SECRET:}
    notification-url: ${MERCADOPAGO_NOTIFICATION_URL:}
    back-url-base: ${MERCADOPAGO_BACK_URL_BASE:http://localhost:5180}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5180,http://localhost:5173,http://localhost:3000,http://127.0.0.1:5180,http://127.0.0.1:5173,http://127.0.0.1:3000} # Origens autorizadas (CORS), separadas por vírgula
  metrics:
    # Token dedicado para o Prometheus raspar /actuator/prometheus (Authorization: Bearer).
    # Vazio = rota restrita ao papel de moderação (comportamento seguro padrão).
    scrape-token: ${METRICS_SCRAPE_TOKEN:}
  storage:
    local-upload-dir: ${UPLOAD_DIR:./data/uploads} # Diretório isolado local para páginas e avatares
    max-file-size-mb: ${STORAGE_MAX_FILE_SIZE_MB:15} # Limite por arquivo (defesa em profundidade; alinhado ao multipart)

# Observabilidade, Health Probes e Métricas para Prometheus
logging:
  structured:
    format:
      console: logstash

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true


