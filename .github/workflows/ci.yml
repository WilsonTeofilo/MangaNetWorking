name: MangaNetWorking CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ====================================================
  # JOB 1: Backend Java 21 + Spring Boot + Testcontainers
  # ====================================================
  backend-ci:
    name: Backend Test Suite & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código-Fonte
        uses: actions/checkout@v4

      - name: Configurar Java 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Executar Testes Unitários e Integração (Testcontainers)
        working-directory: ./backend
        run: |
          mvn clean test -B

      - name: Publicar Relatórios em Caso de Falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: ./backend/target/surefire-reports/

  # ====================================================
  # JOB 2: Frontend React 19 + TypeScript + Vite
  # ====================================================
  frontend-ci:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código-Fonte
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Instalar Dependências Limpas
        working-directory: ./frontend
        run: npm ci

      - name: Compilar Frontend (tsc + vite build)
        working-directory: ./frontend
        run: npm run build

  # ====================================================
  # JOB 3: Validação de Docker Multi-Stage Build
  # ====================================================
  docker-validation:
    name: Docker Build Multi-Stage Check
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código-Fonte
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Validar Build do Backend Dockerfile
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: manganetworking/backend:test

      - name: Validar Build do Frontend Dockerfile
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: manganetworking/frontend:test
