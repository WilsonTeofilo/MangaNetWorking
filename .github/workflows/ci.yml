name: MangaNetWorking CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ====================================================
  # JOB 1: Backend Java 21 + Spring Boot + Testcontainers
  # ====================================================
  backend-ci:
    name: Backend Test Suite & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código-Fonte
        uses: actions/checkout@v4

      - name: Configurar Java 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Executar Testes Unitários e Integração (Testcontainers)
        working-directory: ./backend
        run: |
          mvn clean test -B

      - name: Publicar Relatórios em Caso de Falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: ./backend/target/surefire-reports/

  # ====================================================
  # JOB 2: Frontend React 19 + TypeScript + Vite
  # ====================================================
  frontend-ci:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código-Fonte
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Instalar Dependências Limpas
        working-directory: ./frontend
        run: npm ci

      - name: Compilar Frontend (tsc + vite build)
        working-directory: ./frontend
        run: npm run build

  # ====================================================
  # JOB 3: Validação de Docker Multi-Stage Build
  # ====================================================
  docker-validation:
    name: Docker Build Multi-Stage Check
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código-Fonte
        uses: actions/checkout@v4

      # Valida a sintaxe do compose de produção antes de construir.
      # As variáveis obrigatórias (sufixo ":?") são preenchidas com placeholders
      # só para a checagem — nenhum deploy acontece aqui.
      - name: Validar Sintaxe do docker-compose.prod.yml
        env:
          POSTGRES_PASSWORD: ci-placeholder-nao-usado
          AES_SECRET_KEY: ci-placeholder-chave-256-bits-0000000000000000
          OTP_HMAC_SECRET: ci-placeholder-otp-hmac-secret-32-bytes
          PUBLIC_FRONTEND_URL: https://frontend.ci.example.invalid
          MONGO_ROOT_USERNAME: ci-placeholder
          MONGO_ROOT_PASSWORD: ci-placeholder-nao-usado
          SPRING_DATA_MONGODB_URI: mongodb://ci-placeholder:ci-placeholder-nao-usado@mongodb:27017/manganetworking_events?authSource=admin
          REDIS_PASSWORD: ci-placeholder-nao-usado
        run: docker compose -f docker-compose.prod.yml config --quiet

      # Build direto com o daemon do runner: sem setup-buildx-action (driver
      # docker-container) nem build-push-action, que eram os pontos de falha.
      - name: Build Multi-Stage do Backend (Dockerfile)
        run: |
          docker build \
            --file ./backend/Dockerfile \
            --tag manganetworking/backend:ci \
            ./backend

      - name: Build Multi-Stage do Frontend (Dockerfile)
        run: |
          docker build \
            --file ./frontend/Dockerfile \
            --tag manganetworking/frontend:ci \
            ./frontend

      - name: Remover Imagens de CI
        if: always()
        run: |
          docker image rm --force manganetworking/backend:ci manganetworking/frontend:ci || true

  # O mesmo smoke E2E executado pelo operador local também roda em cada PR.
  smoke-e2e:
    name: Smoke E2E 12/12 (stack real)
    needs: [backend-ci, frontend-ci, docker-validation]
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-smoke-password-only
      PLATFORM_MAIL_ENABLED: "false"
      PRIVACY_POLICY_VERSION: ci-v1
    steps:
      - name: Checkout Código-Fonte
        uses: actions/checkout@v4

      - name: Subir stack real com Dev Outbox isolado
        run: docker compose up -d --build

      - name: Aguardar backend saudável
        shell: pwsh
        run: |
          $deadline = (Get-Date).AddMinutes(5)
          do {
            try {
              $health = Invoke-RestMethod http://localhost:8085/actuator/health/readiness
              if ($health.status -eq 'UP') { break }
            } catch { }
            if ((Get-Date) -ge $deadline) { throw 'Backend não ficou saudável em 5 minutos.' }
            Start-Sleep -Seconds 5
          } while ($true)

      - name: Executar smoke ponta a ponta 12/12
        shell: pwsh
        run: ./smoke_test_e2e.ps1

      - name: Logs da stack em falha
        if: failure()
        run: docker compose logs --no-color

      - name: Encerrar stack de CI
        if: always()
        run: docker compose down --remove-orphans
