server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Compressão Gzip para performance máxima
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/xml application/json image/svg+xml font/woff font/woff2;
    gzip_disable "MSIE [1-6]\.";

    # Headers de Segurança
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # Proxy Reverso para a API Backend Spring Boot
    #
    # ^~ é OBRIGATÓRIO aqui: sem ele, a regra de assets estáticos abaixo
    # (.png/.jpg/.webp) ganha da rota /api/ e o Nginx servia o index.html
    # em vez de proxiar — quebrava TODA imagem em /api/storage (avatar, capa
    # e banner) com 404, mesmo com o upload gravado no servidor.
    location ^~ /api/ {
        proxy_pass http://backend:8085/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Suporte a upload de arquivos grandes (capítulos e imagens)
        client_max_body_size 200M;
    }

    # Cache Imutável para Assets Vite e Fontes Autoriais "Banca de Rua"
    location ~* \.(?:woff2?|eot|ttf|otf|css|js|png|jpe?g|gif|svg|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Roteamento SPA (Single Page Application)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
