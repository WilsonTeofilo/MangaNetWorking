  <ellipse cx="60" cy="50" rx="5" ry="6" fill="#F4EFE3" stroke="#0B0B0C" stroke-width="2" />
  <circle cx="42" cy="51" r="2.5" fill="#0B0B0C" />
  <circle cx="62" cy="51" r="2.5" fill="#0B0B0C" />

