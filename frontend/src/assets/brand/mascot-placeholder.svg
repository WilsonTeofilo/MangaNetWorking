  <path d="M66 92 L66 106 L82 106 L82 100 L72 100 L72 92 Z" fill="#FFD400" stroke="#0B0B0C" stroke-width="2.5" />

  <!-- Corpo do Tinteiro (Preto Nanquim) -->
